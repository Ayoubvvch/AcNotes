<!-- IndexedDB Local Storage Engine (VaultDB) -->
<script>
(function() {
  const DB_NAME = "VaultDB";
  const DB_VERSION = 1;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("notes")) {
          db.createObjectStore("notes", { keyPath: "id" });
        }
        if (!db.objectStoreNames.contains("meta")) {
          db.createObjectStore("meta", { keyPath: "key" });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e.target.error);
    });
  }

  window._idb = {
    getNotes: async () => {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction("notes", "readonly");
          const req = tx.objectStore("notes").getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (e) {
        return [];
      }
    },
    saveNotes: async (notes) => {
      if (!Array.isArray(notes)) return;
      try {
        const db = await openDB();
        const tx = db.transaction("notes", "readwrite");
        const store = tx.objectStore("notes");
        store.clear();
        notes.forEach(n => store.put(n));
      } catch (e) {}
    },
    saveNote: async (note) => {
      if (!note || !note.id) return;
      try {
        const db = await openDB();
        const tx = db.transaction("notes", "readwrite");
        tx.objectStore("notes").put(note);
      } catch (e) {}
    },
    deleteNote: async (id) => {
      if (!id) return;
      try {
        const db = await openDB();
        const tx = db.transaction("notes", "readwrite");
        tx.objectStore("notes").delete(id);
      } catch (e) {}
    },
    getMeta: async (key, fallback = null) => {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction("meta", "readonly");
          const req = tx.objectStore("meta").get(key);
          req.onsuccess = () => resolve(req.result ? req.result.val : fallback);
          req.onerror = () => resolve(fallback);
        });
      } catch (e) {
        return fallback;
      }
    },
    setMeta: async (key, val) => {
      try {
        const db = await openDB();
        const tx = db.transaction("meta", "readwrite");
        tx.objectStore("meta").put({ key, val });
      } catch (e) {}
    }
  };
})();
</script>

<!-- Cloudflare R2 Storage (Obsidian-Style .Vault Storage Setup) -->
<script>
(function() {
  const R2_BUCKET = "my-vault";
  let r2Client = null;

  try {
    if (window.AWS) {
      AWS.config.update({
        accessKeyId: "d1fc280a9699258034101a4df1da8d02",
        secretAccessKey: "7869df9a17d82189529af41b026f01038bbf838e422d4d282c2c9aa8f13d08f1",
        region: "auto",
        signatureVersion: "v4"
      });
      r2Client = new AWS.S3({
        endpoint: new AWS.Endpoint("https://5d0d1d468b161e84470798a691e7b5b9.r2.cloudflarestorage.com"),
        s3ForcePathStyle: true,
        httpOptions: { timeout: 10000 }
      });
    }
  } catch (err) {
    console.warn("R2 init error", err);
  }

  function parseMdFile(key, rawContent) {
    let folder = '';
    const parts = key.split('/').filter(Boolean);
    if (parts.length > 2) {
      folder = parts.slice(1, -1).join('/');
    }

    let id = Date.now();
    let title = parts[parts.length - 1].replace(/\.md$/i, '');
    let date = new Date().toLocaleDateString();
    let updatedAt = Date.now();
    let pinned = false;
    let text = rawContent || '';

    if (text.startsWith('---')) {
      const endFm = text.indexOf('---', 3);
      if (endFm !== -1) {
        const fmText = text.substring(3, endFm);
        text = text.substring(endFm + 3).trim();
        fmText.split('\n').forEach(line => {
          const idx = line.indexOf(':');
          if (idx !== -1) {
            const k = line.substring(0, idx).trim();
            const val = line.substring(idx + 1).trim().replace(/^["']|["']$/g, '');
            if (k === 'id') id = Number(val) || id;
            if (k === 'title') title = val || title;
            if (k === 'date') date = val || date;
            if (k === 'updatedAt') updatedAt = Number(val) || updatedAt;
            if (k === 'pinned') pinned = val === 'true';
            if (k === 'folder') folder = val || folder;
          }
        });
      }
    }
    return { id, title, text, folder, date, updatedAt, pinned, _key: key };
  }

  function serializeNoteToMd(note) {
    const sanitizeStr = s => (s || '').replace(/\n/g, ' ').replace(/"/g, '\\"');
    const fm = [
      '---',
      `id: ${note.id}`,
      `title: "${sanitizeStr(note.title || 'Untitled')}"`,
      `folder: "${sanitizeStr(note.folder || '')}"`,
      `date: "${sanitizeStr(note.date || '')}"`,
      `updatedAt: ${note.updatedAt || note.id}`,
      `pinned: ${Boolean(note.pinned)}`,
      '---',
      ''
    ].join('\n');
    return fm + (note.text || '');
  }

  function getNoteKey(note) {
    const sanitizeName = (s) => (s || 'Untitled').replace(/[\\/:*?"<>|]/g, '_').trim();
    const fileName = `${sanitizeName(note.title || 'Untitled')}.md`;
    if (note.folder && note.folder.trim() && note.folder !== 'uncategorized' && note.folder !== 'Home') {
      return `.Vault/${note.folder.trim()}/${fileName}`;
    }
    return `.Vault/${fileName}`;
  }

  window._r2 = {
    getNoteKey,
    loadVault: async () => {
      if (!r2Client || !navigator.onLine) return { notes: [], folders: [] };
      try {
        const listRes = await r2Client.listObjectsV2({ Bucket: R2_BUCKET, Prefix: ".Vault/" }).promise();
        if (!listRes.Contents || listRes.Contents.length === 0) {
          return { notes: [], folders: [] };
        }

        const mdItems = listRes.Contents.filter(item => item.Key.endsWith('.md'));
        const folders = new Set();

        const notes = await Promise.all(mdItems.map(async (item) => {
          try {
            const parts = item.Key.split('/').filter(Boolean);
            if (parts.length > 2) {
              const folderPath = parts.slice(1, -1).join('/');
              const folderParts = folderPath.split('/');
              for (let i = 1; i <= folderParts.length; i++) {
                folders.add(folderParts.slice(0, i).join('/'));
              }
            }
            const obj = await r2Client.getObject({ Bucket: R2_BUCKET, Key: item.Key }).promise();
            const rawText = obj.Body.toString('utf-8');
            return parseMdFile(item.Key, rawText);
          } catch (e) {
            return null;
          }
        }));

        return {
          notes: notes.filter(Boolean),
          folders: Array.from(folders)
        };
      } catch (e) {
        return { notes: [], folders: [] };
      }
    },

    saveAllNotes: async (notes) => {
      if (!r2Client || !Array.isArray(notes) || !navigator.onLine) return;
      const tasks = notes.map(n => {
        const key = getNoteKey(n);
        const body = serializeNoteToMd(n);
        return r2Client.putObject({
          Bucket: R2_BUCKET,
          Key: key,
          Body: body,
          ContentType: "text/markdown; charset=utf-8"
        }).promise().catch(() => null);
      });
      return Promise.all(tasks);
    },

    saveNoteFile: async (note, oldKey = null) => {
      if (!r2Client || !navigator.onLine) return;
      const newKey = getNoteKey(note);
      const body = serializeNoteToMd(note);

      await r2Client.putObject({
        Bucket: R2_BUCKET,
        Key: newKey,
        Body: body,
        ContentType: "text/markdown; charset=utf-8"
      }).promise();

      if (oldKey && oldKey !== newKey) {
        await r2Client.deleteObject({ Bucket: R2_BUCKET, Key: oldKey }).promise().catch(() => null);
      }
      note._key = newKey;
      delete note._oldKey;
      return newKey;
    },

    deleteNoteFile: async (note) => {
      if (!r2Client || !navigator.onLine) return;
      const key = note._key || getNoteKey(note);
      await r2Client.deleteObject({ Bucket: R2_BUCKET, Key: key }).promise().catch(() => null);
    }
  };
})();
</script>

<script type="text/babel" data-presets="custom-react">
const { useState, useEffect, useRef, useMemo, useReducer } = React;
const LS = "nv_pro_1";
const LS_FOLDERS = "nv_folders_1";

/* ── Navigation Reducer (Clean, focused without Whiteboard) ── */
const NAV_INIT = { mode: 'list', activeId: null };
const navReducer = (state, action) => {
  switch (action.type) {
    case 'LIST': return { mode: 'list', activeId: null };
    case 'NEW':  return { mode: 'new',  activeId: null };
    case 'VIEW': return { mode: 'view', activeId: action.id };
    case 'EDIT': return { mode: 'edit', activeId: state.activeId };
    default:     return state;
  }
};

/* ── Cloud R2 & IndexedDB Sync Engine ── */
function useSync(notes, setNotes, customFolders, setCustomFolders) {
  const [st, setSt]     = useState('loading');
  const isReady         = useRef(false);
  const syncedHashes    = useRef(new Map());

  const getNoteHash = (n) => `${n.id}_${n.title}_${n.folder}_${(n.text||'').length}_${Boolean(n.pinned)}_${n.updatedAt||n.id}`;

  useEffect(() => {
    const init = async () => {
      try {
        let localNotes   = await window._idb.getNotes();
        let localFolders = await window._idb.getMeta('folders');
        let deletedIds   = await window._idb.getMeta('deletedIds', []);

        if (!localNotes || localNotes.length === 0) {
          try {
            const lsNotes = JSON.parse(localStorage.getItem(LS) || '[]');
            if (lsNotes.length > 0) {
              localNotes = lsNotes;
              await window._idb.saveNotes(lsNotes);
            }
          } catch {}
        }
        if (!localFolders) {
          try {
            localFolders = JSON.parse(localStorage.getItem(LS_FOLDERS) || '[]');
            if (localFolders) await window._idb.setMeta('folders', localFolders);
          } catch {}
        }
        if (!deletedIds || deletedIds.length === 0) {
          try {
            deletedIds = JSON.parse(localStorage.getItem('nv_deleted_1') || '[]');
            if (deletedIds) await window._idb.setMeta('deletedIds', deletedIds);
          } catch {}
        }

        localNotes   = localNotes || [];
        localFolders = localFolders || [];
        deletedIds   = deletedIds || [];

        if (localNotes.length > 0) setNotes(localNotes);
        if (localFolders.length > 0 && setCustomFolders) setCustomFolders(localFolders);

        // Fetch Cloud R2 Vault in background if online
        let r2Data = { notes: [], folders: [] };
        if (window._r2 && navigator.onLine) {
          r2Data = await window._r2.loadVault().catch(() => ({ notes: [], folders: [] }));
        }

        if (r2Data.notes.length === 0 && localNotes.length > 0 && navigator.onLine) {
          if (window._r2) window._r2.saveAllNotes(localNotes);
          r2Data.notes = localNotes;
        }

        const mergedMap = new Map();
        const addNotesToMap = (list) => {
          if (!list || !Array.isArray(list)) return;
          list.forEach(n => {
            if (deletedIds.includes(n.id)) return;
            if (!mergedMap.has(n.id)) {
              mergedMap.set(n.id, n);
            } else {
              const existing = mergedMap.get(n.id);
              const exTs = existing.updatedAt || existing.id;
              const newTs = n.updatedAt || n.id;
              if (newTs > exTs) mergedMap.set(n.id, n);
            }
          });
        };

        addNotesToMap(localNotes);
        addNotesToMap(r2Data.notes);

        const finalNotes = Array.from(mergedMap.values()).sort((a, b) => b.id - a.id);
        const folderSet = new Set(localFolders);
        if (r2Data.folders && Array.isArray(r2Data.folders)) {
          r2Data.folders.forEach(f => folderSet.add(f));
        }
        const finalFolders = Array.from(folderSet);

        setNotes(finalNotes);
        if (setCustomFolders) setCustomFolders(finalFolders);

        await window._idb.saveNotes(finalNotes);
        await window._idb.setMeta('folders', finalFolders);
        localStorage.setItem(LS, JSON.stringify(finalNotes));
        localStorage.setItem(LS_FOLDERS, JSON.stringify(finalFolders));

        finalNotes.forEach(n => syncedHashes.current.set(n.id, getNoteHash(n)));
      } catch (e) {
        setSt('err');
      } finally {
        isReady.current = true;
        setSt(navigator.onLine ? 'idle' : 'err');
      }
    };

    init();

    const handleOnline = () => { setSt('saving'); init(); };
    const handleOffline = () => setSt('err');
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    return () => {
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
    };
  }, []);

  // Incremental Auto-Sync
  useEffect(() => {
    if (!isReady.current) return;

    window._idb.saveNotes(notes);
    if (customFolders) window._idb.setMeta('folders', customFolders);
    localStorage.setItem(LS, JSON.stringify(notes));
    if (customFolders) localStorage.setItem(LS_FOLDERS, JSON.stringify(customFolders));

    const dirtyNotes = notes.filter(n => {
      const currentHash = getNoteHash(n);
      const savedHash = syncedHashes.current.get(n.id);
      return currentHash !== savedHash;
    });

    if (dirtyNotes.length === 0) return;
    if (!navigator.onLine) {
      setSt('err');
      return;
    }

    const timer = setTimeout(async () => {
      setSt('saving');
      try {
        if (window._r2) {
          await Promise.all(dirtyNotes.map(n => {
            const oldKey = n._oldKey || null;
            return window._r2.saveNoteFile(n, oldKey);
          }));
        }
        dirtyNotes.forEach(n => syncedHashes.current.set(n.id, getNoteHash(n)));
        setSt('ok');
        setTimeout(() => setSt('idle'), 2000);
      } catch (e) {
        setSt('err');
        setTimeout(() => setSt('idle'), 3000);
      }
    }, 1200);

    return () => clearTimeout(timer);
  }, [notes, customFolders]);

  return st;
}

/* ── Markdown Viewer with KaTeX & RTL auto detection ── */
const escapeHtml = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

const toggleTaskInText = (text, targetIndex) => {
  let currentIndex = 0;
  return text.replace(/^([ \t]*[-*+]\s+)\[([ xX])\]/gm, (match, prefix, state) => {
    if (currentIndex === targetIndex) {
      currentIndex++;
      const newState = (state === ' ' ? 'x' : ' ');
      return `${prefix}[${newState}]`;
    }
    currentIndex++;
    return match;
  });
};

const MarkdownViewer = ({ content, onToggleTask }) => {
  const containerRef = useRef(null);

  const html = useMemo(() => {
    if (!content) return { __html: '' };
    let mathBlocks = [];
    let temp = content.replace(/(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\(.*?\\\)|\$[^$\n]+\$)/g, (match) => {
      mathBlocks.push(escapeHtml(match));
      return `@@MATHBLOCK_${mathBlocks.length - 1}@@`;
    });
    let rawHtml = marked.parse(temp, { breaks: true });
    mathBlocks.forEach((block, i) => {
      rawHtml = rawHtml.replace(`@@MATHBLOCK_${i}@@`, block);
    });
    let cleanHtml = DOMPurify.sanitize(rawHtml, {
      ADD_TAGS: ['input'],
      ADD_ATTR: ['dir', 'type', 'checked', 'disabled', 'data-task-index'],
      ALLOW_DATA_ATTR: true
    });
    const parser = new DOMParser();
    const doc = parser.parseFromString(cleanHtml, 'text/html');
    doc.querySelectorAll('p,h1,h2,h3,h4,h5,h6,blockquote,th,td').forEach(el => el.setAttribute('dir', 'auto'));

    let taskCount = 0;
    doc.querySelectorAll('li').forEach(li => {
      const checkbox = li.querySelector('input[type="checkbox"]');
      if (checkbox) {
        li.classList.add('task-list-item');
        checkbox.removeAttribute('disabled');
        checkbox.setAttribute('data-task-index', taskCount);
        taskCount++;
        if (checkbox.checked) li.classList.add('task-done');
      }
    });

    const rtlRx = /[\u0591-\u07FF\uFB1D-\uFDFD\uFE70-\uFEFC]/;
    const ltrRx = /[A-Za-z]/;
    doc.querySelectorAll('ul,ol').forEach(list => {
      const firstLi = Array.from(list.children).find(el => el.tagName === 'LI');
      if (!firstLi) return;
      const txt = firstLi.textContent.trim();
      let isRTL = false;
      for (let i = 0; i < txt.length; i++) {
        if (rtlRx.test(txt[i])) { isRTL = true; break; }
        if (ltrRx.test(txt[i])) { isRTL = false; break; }
      }
      const dir = isRTL ? 'rtl' : 'ltr';
      list.setAttribute('dir', dir);
      Array.from(list.children).forEach(li => { if (li.tagName === 'LI') li.setAttribute('dir', dir); });
    });
    return { __html: doc.body.innerHTML };
  }, [content]);

  useEffect(() => {
    if (containerRef.current && window.renderMathInElement) {
      renderMathInElement(containerRef.current, {
        delimiters: [
          {left:'$$',right:'$$',display:true},
          {left:'\\[',right:'\\]',display:true},
          {left:'$',right:'$',display:false},
          {left:'\\(',right:'\\)',display:false}
        ],
        throwOnError: false
      });
    }
  }, [html]);

  const handleContainerClick = (e) => {
    const target = e.target;
    if (target && target.tagName === 'INPUT' && target.type === 'checkbox') {
      const taskIndex = target.getAttribute('data-task-index');
      if (taskIndex !== null && onToggleTask) {
        onToggleTask(parseInt(taskIndex, 10));
      }
    }
  };

  return <div ref={containerRef} onClick={handleContainerClick} className="md flex-grow font-sans-body" dangerouslySetInnerHTML={html} />;
};

/* ── CodeMirror Formatting Toolbar Helper ── */
const fmtCM = (cm, type) => {
  if (!cm) return;
  cm.focus();
  const F = {
    bold:      { w: ['**','**'],            ph: 'نص عريض'  },
    italic:    { w: ['*','*'],              ph: 'نص مائل'  },
    h1:        { p: '# ',                   ph: 'عنوان رئيسي'  },
    h2:        { p: '## ',                  ph: 'عنوان فرعي'  },
    bullet:    { p: '- ',                   ph: 'عنصر قائمة'  },
    task:      { p: '- [ ] ',               ph: 'مهمة جديدة'  },
    quote:     { p: '> ',                   ph: 'اقتباس'      },
    code:      { w: ['`','`'],              ph: 'كود'        },
    codeblock: { w: ['```\n','\n```'],      ph: 'كتلة برمجية' },
    link:      { w: ['[','](url)'],         ph: 'رابط'       },
    math:      { w: ['$','$'],              ph: 'معادلة'     },
    mathblock: { w: ['\n\\[\n','\n\\]\n'], ph: 'E=mc^2'     }
  };
  const f = F[type]; if (!f) return;
  const sel = cm.getSelection();
  if (f.w) {
    const [pre, post] = f.w;
    const text = sel || f.ph;
    cm.replaceSelection(pre + text + post, 'around');
  } else {
    const from  = cm.getCursor('start');
    const to    = cm.getCursor('end');
    const lines = [];
    for (let i = from.line; i <= to.line; i++) lines.push(cm.getLine(i));
    cm.replaceRange(
      lines.map(l => f.p + l).join('\n'),
      { line: from.line, ch: 0 },
      { line: to.line,   ch: cm.getLine(to.line).length }
    );
  }
};

const CMEditor = ({ initialValue, onChange, cmRef, onSaveRef }) => {
  const containerRef = useRef(null);

  useEffect(() => {
    if (!containerRef.current || cmRef.current) return;
    const cm = CodeMirror(containerRef.current, {
      value:        initialValue || '',
      mode:         'markdown',
      lineNumbers:  false,
      lineWrapping: true,
      autofocus:    true,
      indentWithTabs: false,
      tabSize:      2,
      extraKeys: {
        'Enter':      'newlineAndIndentContinueMarkdownList',
        'Ctrl-S':     () => onSaveRef.current?.(),
        'Cmd-S':      () => onSaveRef.current?.(),
      }
    });

    cmRef.current = cm;
    cm.on('change', instance => onChange(instance.getValue()));
    return () => {
      if (cmRef.current) {
        try { cmRef.current.getWrapperElement().remove(); } catch {}
        cmRef.current = null;
      }
    };
  }, []);

  return <div ref={containerRef} className="cm-editor-host" />;
};

const getFolderIcon = (folderName) => {
  if (!folderName || folderName === 'uncategorized' || folderName === 'Home') return '🏠';
  const name = folderName.toLowerCase().trim();
  if (name.includes('math') || name.includes('رياضيات')) return '📐';
  if (name.includes('physic') || name.includes('فيزياء')) return '⚛️';
  if (name.includes('crypto') || name.includes('تداول')) return '₿';
  if (name.includes('code') || name.includes('dev') || name.includes('برمجة')) return '💻';
  if (name.includes('book') || name.includes('كتاب') || name.includes('قراءة')) return '📖';
  if (name.includes('star') || name.includes('مهم')) return '⭐';
  return '📁';
};

    const now = Date.now();
    const cleanFolder = (targetFolder || '').trim();
    setNotes(p => p.map(n => n.id === noteId ? { ...n, updatedAt: now, folder: cleanFolder } : n));
    if (cleanFolder && !customFolders.includes(cleanFolder)) {
      setCustomFolders(p => [...p, cleanFolder]);
    }
    showToast(cleanFolder ? `✓ تم النقل إلى "${cleanFolder}"` : `✓ تم النقل إلى الرئيسي`);
  };

  const handleDeleteFolder = (e, folderName) => {
    e.stopPropagation();
    if (!window.confirm(`هل أنت متأكد من حذف مجلد "${folderName}"؟ ستنتقل ملاحظاته للمجلد الرئيسي.`)) return;
    setCustomFolders(p => p.filter(f => f !== folderName));
    setNotes(p => p.map(n => n.folder === folderName ? { ...n, folder: '' } : n));
    if (selectedFolder === folderName) setSelectedFolder('all');
    showToast(`تم حذف المجلد "${folderName}"`);
  };

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3000); };
  const syncSt    = useSync(notes, setNotes, customFolders, setCustomFolders);
  const activeNote = notes.find(n => n.id === nav.activeId);

  const getDisplayTitle = (n) => {
    if (n.title) return n.title;
    const first = (n.text || '').split('\n')[0].replace(/^[#>*\-\s]+/, '').trim();
    return first ? first.substring(0, 40) : 'ملاحظة جديدة';
  };

  const getPreviewText = (n) => (n.text || '').replace(/^[#>*\-\s]+/gm, '').trim().substring(0, 110);

  const makeDate = () => new Date().toLocaleString('ar-EG', {
    day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });

  const handleSaveNew = (title, text, folder = '') => {
    if (!text.trim() && !title.trim()) return;
    const now = Date.now();
    const targetFolder = (folder || (selectedFolder !== 'all' && selectedFolder !== 'uncategorized' ? selectedFolder : '')).trim();
    setNotes(p => [{
      id: now, updatedAt: now,
      date: makeDate(),
      title: title.trim() || 'ملاحظة جديدة',
      text: text.trim(),
      folder: targetFolder,
      pinned: false
    }, ...p]);
    if (targetFolder && !customFolders.includes(targetFolder)) {
      setCustomFolders(p => [...p, targetFolder]);
    }
    dispatch({ type: 'LIST' });
    showToast('✓ تم حفظ الملاحظة');
  };

  const handleSaveEdit = (title, text, folder = '') => {
    if (!text.trim() && !title.trim()) return;
    const now = Date.now();
    const cleanFolder = (folder || '').trim();
    setNotes(p => p.map(n => {
      if (n.id === nav.activeId) {
        const oldKey = n._key || window._r2?.getNoteKey?.(n);
        return {
          ...n,
          updatedAt: now,
          title: title.trim() || 'ملاحظة جديدة',
          text: text.trim(),
          folder: cleanFolder,
          _oldKey: oldKey
        };
      }
      return n;
    }));
    if (cleanFolder && !customFolders.includes(cleanFolder)) {
      setCustomFolders(p => [...p, cleanFolder]);
    }
    dispatch({ type: 'VIEW', id: nav.activeId });
    showToast('✓ تم تحديث الملاحظة');
  };

  const handleToggleTask = (noteId, taskIndex) => {
    const now = Date.now();
    setNotes(p => p.map(n => n.id === noteId
      ? { ...n, updatedAt: now, text: toggleTaskInText(n.text, taskIndex) }
      : n
    ));
  };

  const handleDelete = (id) => {
    if (!window.confirm('هل تريد حذف هذه الملاحظة نهائياً؟')) return;
    const targetNote = notes.find(n => n.id === id);
    if (targetNote && window._r2) window._r2.deleteNoteFile(targetNote);
    let delList = [];
    try { delList = JSON.parse(localStorage.getItem('nv_deleted_1') || '[]'); } catch {}
    if (!delList.includes(id)) {
      delList.push(id);
      localStorage.setItem('nv_deleted_1', JSON.stringify(delList));
    }
    if (window._idb) {
      window._idb.deleteNote(id);
      window._idb.setMeta('deletedIds', delList);
    }
    setNotes(p => p.filter(n => n.id !== id));
    dispatch({ type: 'LIST' });
    showToast('تم حذف الملاحظة');
  };

  const togglePin = (e, id) => {
    e.stopPropagation();
    setNotes(p => p.map(n => n.id === id ? { ...n, pinned: !n.pinned } : n));
  };

  const handleBackup = () => {
    try {
      const backup = {
        version: 3,
        exportedAt: new Date().toISOString(),
        notesCount: notes.length,
        folders: [...allFolders],
        notes: [...notes]
      };
      const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `AcNotes_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast(`✓ تم تصدير نسخة احتياطية (${notes.length} ملاحظة)`);
    } catch {
      showToast('✗ فشل تصدير النسخة');
    }
  };

  const handleRestoreBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const backup = JSON.parse(ev.target.result);
        if (!backup.notes || !Array.isArray(backup.notes)) {
          showToast('✗ ملف نسخة غير صالح'); return;
        }
        if (!window.confirm(`استعادة ${backup.notes.length} ملاحظة؟`)) return;
        if (backup.folders && Array.isArray(backup.folders)) {
          setCustomFolders(prev => Array.from(new Set([...prev, ...backup.folders])));
        }
        setNotes(prev => {
          const merged = new Map();
          prev.forEach(n => merged.set(n.id, n));
          backup.notes.forEach(n => {
            if (!merged.has(n.id)) {
              merged.set(n.id, n);
            } else {
              const ex  = merged.get(n.id);
              const exTs = ex.updatedAt || ex.id;
              const bkTs = n.updatedAt  || n.id;
              if (bkTs > exTs) merged.set(n.id, n);
            }
          });
          const result = Array.from(merged.values()).sort((a, b) => b.id - a.id);
          localStorage.setItem(LS, JSON.stringify(result));
          if (window._idb) window._idb.saveNotes(result);
          return result;
        });
        showToast(`✓ تمت استعادة ${backup.notes.length} ملاحظة`);
        dispatch({ type: 'LIST' });
      } catch {
        showToast('✗ فشلت القراءة من الملف');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const list = useMemo(() => {
    let l = [...notes];
    if (filter === 'pinned') l = l.filter(n => n.pinned);
    if (selectedFolder === 'uncategorized') {
      l = l.filter(n => !n.folder || !n.folder.trim());
    } else if (selectedFolder && selectedFolder !== 'all') {
      l = l.filter(n => n.folder === selectedFolder);
    }
    if (search.trim()) {
      const q = search.toLowerCase();
      l = l.filter(n => (n.title||'').toLowerCase().includes(q) || n.text.toLowerCase().includes(q) || (n.folder||'').toLowerCase().includes(q));
    }
    return l.sort((a, b) => (b.pinned - a.pinned) || (b.id - a.id));
  }, [notes, search, filter, selectedFolder]);

  return (
    <div className="min-h-screen bg-transparent text-zinc-200">
      {/* Toast Alert */}
      {toast && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[300] px-4 py-2 bg-zinc-800 border border-zinc-700 rounded-xl shadow-2xl text-xs font-medium text-zinc-100 font-sans-body pointer-events-none whitespace-nowrap">
          {toast}
        </div>
      )}

      {/* Header */}
      <header className="sticky top-0 z-40 bg-[#09090b]/90 backdrop-blur-md border-b border-zinc-800/60">
        <div className="max-w-5xl mx-auto flex items-center justify-between gap-3 px-4 py-3">
          {/* Brand Logo AcNotes */}
          <div className="cursor-pointer flex items-center gap-2.5 shrink-0" onClick={() => dispatch({ type: 'LIST' })}>
            <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 shadow-md shadow-emerald-500/20 flex items-center justify-center">
              <span className="text-zinc-950 font-black font-heading text-sm">Ac</span>
            </div>
            <h1 className="text-lg font-bold text-zinc-100 font-heading tracking-tight">AcNotes</h1>
          </div>

          <input type="file" accept=".json" ref={backupImportRef} onChange={handleRestoreBackup} className="hidden" />

          {/* Sync Dot */}
          <div className="flex items-center gap-2 ml-auto">
            <Dot st={syncSt} />

            {/* Menu */}
            <div className="relative" ref={menuRef}>
              <button onClick={() => setShowMenu(p => !p)} className="p-1.5 text-zinc-400 hover:text-zinc-100 bg-zinc-900 border border-zinc-800 rounded-xl">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 5v.01M12 12v.01M12 19v.01" />
                </svg>
              </button>
              {showMenu && (
                <div className="absolute left-0 mt-2 w-48 bg-zinc-900/95 border border-zinc-800 rounded-2xl shadow-2xl py-1 z-50">
                  <button onClick={() => { setShowMenu(false); handleBackup(); }} className="w-full text-right px-4 py-2 text-xs text-zinc-300 hover:bg-zinc-800 flex items-center justify-between">
                    <span>تصدير نسخة احتياطية</span>
                    <span>💾</span>
                  </button>
                  <button onClick={() => { setShowMenu(false); backupImportRef.current?.click(); }} className="w-full text-right px-4 py-2 text-xs text-zinc-300 hover:bg-zinc-800 flex items-center justify-between">
                    <span>استعادة نسخة احتياطية</span>
                    <span>📥</span>
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>

        {/* Search Bar in List Mode */}
        {nav.mode === 'list' && (
          <div className="max-w-5xl mx-auto px-4 pb-2.5 flex items-center gap-2">
            <div className="relative flex-grow">
              <input dir="auto" value={search} onChange={e => setSearch(e.target.value)} placeholder="بحث في الملاحظات..."
                className="w-full smooth-input px-3.5 py-1.5 pr-8 text-xs font-sans-body placeholder-zinc-500 bg-zinc-900/90" />
              <svg className="absolute right-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
              {search && <button onClick={() => setSearch('')} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-zinc-400 text-xs">✕</button>}
            </div>
            <div className="flex bg-zinc-900 border border-zinc-800 rounded-xl p-0.5 shrink-0">
              <button onClick={() => setFilter('all')} className={`px-2.5 py-1 text-[11px] rounded-lg ${filter==='all' ? 'bg-zinc-800 text-zinc-100 font-bold' : 'text-zinc-400'}`}>الكل</button>
              <button onClick={() => setFilter('pinned')} className={`px-2.5 py-1 text-[11px] rounded-lg ${filter==='pinned' ? 'bg-zinc-800 text-zinc-100 font-bold' : 'text-zinc-400'}`}>المثبتة</button>
            </div>
          </div>
        )}
      </header>

      {/* Main Content */}
      <main className="max-w-5xl mx-auto px-4 py-6 relative z-10 pb-28">
        {nav.mode === 'new' && (
          <Editor
            initialFolder={selectedFolder !== 'all' && selectedFolder !== 'uncategorized' ? selectedFolder : ''}
            folders={allFolders}
            onAddFolder={handleAddFolder}
            onSave={handleSaveNew}
            onCancel={() => dispatch({ type: 'LIST' })}
          />
        )}
        {nav.mode === 'edit' && activeNote && (
          <Editor
            initialTitle={activeNote.title}
            initialText={activeNote.text}
            initialFolder={activeNote.folder || ''}
            folders={allFolders}
            onAddFolder={handleAddFolder}
            onSave={handleSaveEdit}
            onCancel={() => dispatch({ type: 'VIEW', id: activeNote.id })}
          />
        )}
        {nav.mode === 'view' && activeNote && (
          <ViewMode
            note={activeNote}
            allFolders={allFolders}
            onEdit={() => dispatch({ type: 'EDIT' })}
            onClose={() => dispatch({ type: 'LIST' })}
            onDelete={() => handleDelete(activeNote.id)}
            onToggleTask={(taskIdx) => handleToggleTask(activeNote.id, taskIdx)}
            onMoveNote={handleMoveNote}
            onAddFolder={handleAddFolder}
          />
        )}
        {nav.mode === 'list' && (
          <>
            {/* Folders horizontal scroll */}
            <div className="mb-6">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-semibold text-zinc-400">المجلدات ({allFolders.length + 1})</span>
                <button
                  onClick={() => {
                    const nf = prompt('أدخل اسم المجلد الجديد:');
                    if (nf && nf.trim()) {
                      handleAddFolder(nf.trim());
                      setSelectedFolder(nf.trim());
                    }
                  }}
                  className="text-xs text-emerald-400 hover:text-emerald-300 font-medium"
                >
                  + مجلد جديد
                </button>
              </div>

              <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <button
                  onClick={() => setSelectedFolder('all')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-medium border shrink-0 transition-colors ${selectedFolder === 'all' ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 font-bold' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}
                >
                  📁 جميع الملاحظات ({notes.length})
                </button>
                <button
                  onClick={() => setSelectedFolder('uncategorized')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-medium border shrink-0 transition-colors ${selectedFolder === 'uncategorized' ? 'bg-amber-500/15 border-amber-500/40 text-amber-300 font-bold' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}
                >
                  🏠 الرئيسي ({notes.filter(n => !n.folder || !n.folder.trim()).length})
                </button>
                {allFolders.map(f => {
                  const count = notes.filter(n => n.folder === f).length;
                  return (
                    <button
                      key={f}
                      onClick={() => setSelectedFolder(f)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-medium border shrink-0 transition-colors flex items-center gap-1.5 ${selectedFolder === f ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300 font-bold' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}
                    >
                      <span>{getFolderIcon(f)}</span>
                      <span>{f}</span>
                      <span className="text-[10px] opacity-60">({count})</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Notes Grid */}
            {list.length === 0 ? (
              <div className="flex flex-col items-center justify-center py-20 text-center bg-zinc-900/30 rounded-3xl border border-zinc-800/50 p-6">
                <div className="w-14 h-14 mb-3 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-2xl">
                  📝
                </div>
                <h3 className="text-base font-semibold text-zinc-300 font-heading">لا توجد ملاحظات هنا</h3>
                <p className="text-zinc-500 text-xs mt-1 max-w-xs">ابدأ بتدوين أول فكرة أو ملاحظة لك الآن.</p>
                <button
                  onClick={() => dispatch({ type: 'NEW' })}
                  className="mt-4 px-4 py-2 text-xs bg-emerald-500 text-emerald-950 font-bold rounded-xl hover:bg-emerald-400 transition-colors"
                >
                  + إنشاء ملاحظة جديدة
                </button>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                {list.map(n => (
                  <NoteCard
                    key={n.id}
                    note={n}
                    allFolders={allFolders}
                    onOpen={id => dispatch({ type: 'VIEW', id })}
                    onPin={togglePin}
                    onMove={handleMoveNote}
                    onAddFolder={handleAddFolder}
                    getDisplayTitle={getDisplayTitle}
                    getPreviewText={getPreviewText}
                  />
                ))}
              </div>
            )}
          </>
        )}
      </main>

      {/* Floating Action Button for Mobile: Quick New Note */}
      {nav.mode === 'list' && (
        <button
          onClick={() => dispatch({ type: 'NEW' })}
          className="fab"
          title="ملاحظة جديدة"
        >
          <svg className="w-7 h-7 text-zinc-950 font-bold" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.6}>
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" />
          </svg>
        </button>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
