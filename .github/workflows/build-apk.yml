name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AcNotes-v2.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcNotes-v2.2.0-APK
          path: release-output/AcNotes-v2.2.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.2.0
          name: "AcNotes v2.2.0 - Ultra Smooth 120 FPS Scrolling"
          body: |
            ### ⚡ AcNotes v2.2.0 - Ultra Smooth Performance Edition
            
            - **القضاء التام على التقطيع أثناء التمرير (Zero-Jank 120 FPS Scrolling):**
              - تم استخراج وحساب المعاينة (Preview) مسبقاً وتخزينها، مما أوقف ملايين العمليات المتكررة لتقطيع النصوص الكبيرة (`lines().filter()`) أثناء التمرير.
              - تحسين كامل لمكونات `LazyColumn` مع تثبيت الـ `contentType` والحدود والمظهر الميموري.
            - **محرك الرياضيات الفائق (KaTeX / LaTeX):**
              - عرض فائق الجمال لجميع المعادلات الرياضية والتفاضل والتكامل والجداول.
            - **مزامنة كاملة:** دعم مستودعات الملاحظات الكبيرة بأكثر من 100 ملاحظة.
          files: release-output/AcNotes-v2.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
