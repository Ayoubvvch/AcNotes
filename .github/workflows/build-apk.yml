name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AcNotes-v2.0.0-PureNative.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcNotes-PureNative-APK
          path: release-output/AcNotes-v2.0.0-PureNative.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: "AcNotes v2.0.0 - Pure Native Android (Jetpack Compose)"
          body: |
            ### 🚀 AcNotes v2.0.0 - Pure Native Edition
            
            - **100% Pure Native Android (Kotlin + Jetpack Compose + Material 3)** - Zero WebView / Zero HTML!
            - أداء فائق وسرعة استجابة فورية 120Hz مستوحاة من تطبيقات النخبة مثل DeepSeek و ChatGPT.
            - قاعدة بيانات محلية أصلية SQLite فائقة السرعة تعمل بدون إنترنت بنسبة 100%.
            - محرك Markdown أصلي بالكامل مع مربعات مهام تفاعلية (Interactive Checkboxes).
            - دعم فائق للنصوص العربية والإنجليزية والاتجاهين (RTL & LTR).
            - مزامنة سحابية هادئة في الخلفية عبر Coroutines مع Cloudflare R2.
            
            **طريقة التثبيت:**
            حمل ملف `AcNotes-v2.0.0-PureNative.apk` وثبّته مباشرة.
          files: release-output/AcNotes-v2.0.0-PureNative.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
