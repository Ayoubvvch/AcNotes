name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/AcNotes-v3.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcNotes-v3.1.0-Signed-APK
          path: release-output/AcNotes-v3.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v3.1.0
          name: "AcNotes v3.1.0 - Universal Cloud Sign In, Sign Up & Offline Mode"
          body: |
            ### 🚀 AcNotes v3.1.0 - Universal Cloud Sign In, Sign Up & Offline Mode

            - 🔑 **Streamlined Vault Sign In & Direct Data Recovery:**
              - Fast, secure sign-in with your Cloudflare R2 / S3 credentials to immediately retrieve and sync your existing notes and folders.
            - 👤 **Sign Up & Profile Personalization:**
              - Clean single-screen sign up with customizable name and avatar icon, stored locally and backed up to your vault.
            - 📴 **True Local-First Offline Mode:**
              - Full app capabilities without login or sync required. Link cloud storage anytime from settings.
            - 🔄 **In-App Updater with Live Progress:**
              - Download and install official APK updates directly inside the app with real-time download percentage.
            - 🔐 **Cryptographically Signed APK (In-Place Updates):**
              - Install directly over previous releases without uninstalling.
          files: release-output/AcNotes-v3.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
