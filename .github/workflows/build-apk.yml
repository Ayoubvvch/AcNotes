name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/AcNotes-v3.2.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
            name: AcNotes-v3.2.2-Signed-APK
            path: release-output/AcNotes-v3.2.2.apk
            if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: v3.2.2
            name: "AcNotes v3.2.2 - Hidden .AcNotes Folder, Offline Connect & Profile Name Editor"
            body: |
              ### 🚀 AcNotes v3.2.2 - Hidden .AcNotes Folder, Offline Connect & Profile Name Editor

              - 📁 **Organized Hidden Cloud Storage (`.AcNotes`):**
                - All notes, subfolders, profile data (`.profile.json`), and custom gallery avatars (`.profile_avatar.jpg`) are now neatly housed inside a hidden root folder `.AcNotes/`.
                - Fully backwards-compatible with existing notes and profiles in `.Vault/`.
              - 🔌 **Seamless Offline-to-Cloud Connection:**
                - Fixed unresponsive "Connect to Cloud Vault" button in Settings when operating in offline mode.
                - Easily switch between offline mode and your Cloudflare R2 vault anytime.
              - ✏️ **Editable Profile Name in Settings:**
                - You can now edit your profile name directly inside Settings via the pencil icon, automatically updating both local storage and the cloud vault.
              - 🔐 **Cryptographically Signed APK (In-Place Updates):**
                - Retains release key signature for seamless in-place installation over existing releases.
            files: release-output/AcNotes-v3.2.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
