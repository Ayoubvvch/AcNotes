name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AcNotes-v2.4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcNotes-v2.4.0-APK
          path: release-output/AcNotes-v2.4.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.4.0
          name: "AcNotes v2.4.0 - Ultra Smooth Motion & Physics Transitions"
          body: |
            ### ✨ AcNotes v2.4.0 - Ultra Smooth Motion & Native Physics Edition

            - **Seamless Predictive Screen Transitions:**
              - Parallax slide & fade navigation when opening, editing, and closing notes.
              - Predictive backward sliding and header drag-back gesture.
            - **Tactile Physics Feedback:**
              - Physical scale-spring compression on card touches with zero dropped frames.
            - **Hardware-Accelerated WebView & GPU Layer Promotion:**
              - Enabled hardware layer (`LAYER_TYPE_HARDWARE`) and `offscreenPreRaster` in reader WebView.
              - Deduplicated JavaScript markdown parsing to prevent animation jank.
              - Promoted reader to dedicated GPU composite layer (`translateZ(0)`) with `content-visibility: auto` for instant 120 FPS scrolling through 20,000+ word notes.
          files: release-output/AcNotes-v2.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
