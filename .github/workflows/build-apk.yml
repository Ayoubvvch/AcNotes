name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/AcNotes-v3.4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
            name: AcNotes-v3.4.0-Signed-APK
            path: release-output/AcNotes-v3.4.0.apk
            if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: v3.4.0
            name: "AcNotes v3.4.0 - Instant Direct Share to Home & Pure .Vault Storage"
            body: |
              ### 🚀 AcNotes v3.4.0 - Instant Direct Share to Home & Pure .Vault Storage

              - 📥 **Instant Direct Share to Home:**
                - Share any `.md`, `.txt`, text, or document directly from other apps (Google Drive, Files, Chrome, WhatsApp) into AcNotes.
                - Automatically saved straight to **Home** (`folder = ""`) without dialog interruptions, followed by immediate background sync to Cloudflare R2.
              - 📑 **Multi-Item Batch Share:**
                - Select and share multiple files at once; all items are processed into Home and synchronized together.
              - ☁️ **Pure `.Vault` Architecture (100% Web App Alignment):**
                - Completely purged all `.AcNotes` paths. The app now operates exclusively on `.Vault/`, working as a true twin brother to the desktop web app (`index.html`).
              - 🔐 **Cryptographically Signed APK (In-Place Updates):**
                - Retains release keystore signature for direct seamless in-place updating over previous builds.
            files: release-output/AcNotes-v3.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
