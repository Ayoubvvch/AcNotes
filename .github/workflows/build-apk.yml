name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AcNotes-v2.3.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcNotes-v2.3.0-APK
          path: release-output/AcNotes-v2.3.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.3.0
          name: "AcNotes v2.3.0 - English UI with Bidirectional Support"
          body: |
            ### 🌐 AcNotes v2.3.0 - Full English UI & Intelligent Bi-Directional Formatting

            - **Full English UI:** Clean, polished English interface inspired by DeepSeek and ChatGPT dark themes.
            - **Intelligent Bidirectional Typography (RTL + LTR):**
              - Automatically recognizes language direction for every note, paragraph, and heading.
              - Arabic notes seamlessly align RTL.
              - English and bilingual notes align LTR with inline math isolated cleanly.
            - **Ultra-Smooth 120 FPS:** Zero-allocation preview caching and instant rendering.
            - **Obsidian-Grade KaTeX & Markdown:** Flawless LaTeX rendering for complex calculus, physics, and markdown tables.
          files: release-output/AcNotes-v2.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
