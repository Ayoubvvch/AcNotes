name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/AcNotes-v3.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
            name: AcNotes-v3.2.0-Signed-APK
            path: release-output/AcNotes-v3.2.0.apk
            if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: v3.2.0
            name: "AcNotes v3.2.0 - Smart Bucket Auto-Discovery & Gallery Profile Avatars"
            body: |
              ### 🚀 AcNotes v3.2.0 - Smart Bucket Auto-Discovery & Gallery Profile Avatars

              - 🔍 **Smart S3 Bucket Auto-Discovery (No Manual Bucket Typing):**
                - Connect effortlessly using only your Account ID, Access Key ID, and Secret Key. AcNotes automatically detects and presents existing buckets (e.g., `my-vault`) as selectable chips with 1-tap selection, plus instant "+ Create New Bucket" support.
              - 📸 **Gallery Profile Picture Picker:**
                - Pick and crop your avatar directly from your device Gallery (`image/*`). Avatars are saved locally and synced to your cloud vault (`.Vault/.profile_avatar.jpg`).
              - 🖼️ **Dynamic Avatar Rendering:**
                - Clean, circular avatar displays across the Top App Bar, Sign Up modal, and Account Settings modal.
              - 🔄 **In-App Updater Ready:**
                - Check for updates and download signed APKs directly within the app.
              - 🔐 **Cryptographically Signed APK (In-Place Updates):**
                - Retains release key signature for seamless in-place installation over existing releases.
            files: release-output/AcNotes-v3.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
