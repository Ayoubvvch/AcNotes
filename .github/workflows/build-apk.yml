name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/AcNotes-v3.5.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
            name: AcNotes-v3.5.0-Signed-APK
            path: release-output/AcNotes-v3.5.0.apk
            if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: v3.5.0
            name: "AcNotes v3.5.0 - Incremental Delta R2 Sync & Offline Excalidraw Viewer"
            body: |
              ### 🚀 AcNotes v3.5.0 - Incremental Delta R2 Sync & Offline Excalidraw Viewer

              - ⚡ **Incremental Delta S3 / R2 Sync:**
                - Completely purged the recurring 45s background sync loop, saving battery and data.
                - Sync now runs on-demand (when saving, deleting, or tapping sync) and upon app launch.
                - Implemented delta downloading via S3 `LastModified` timestamps: only new or modified `.md` files are downloaded, cutting network traffic by ~99%.
              - 🎨 **Offline Excalidraw Whiteboard Viewer:**
                - Zero-dependency, 100% offline-compatible native reader card for Excalidraw notes created on PC.
                - Automatically extracts element statistics, shapes count, and all written text notes directly on the phone.
                - Whiteboard notes are safely protected as read-only on mobile (editing is reserved for PC mouse/stylus).
              - 🏷️ **Intelligent Title Uniqueness:**
                - Added automatic numbered deduplication (`Note (1)`, `Note (2)`) matching the desktop web app architecture to ensure filesystem safety.
              - 🔐 **Cryptographically Signed APK (In-Place Updates):**
                - Retains release keystore signature for direct seamless in-place updating over previous builds.
            files: release-output/AcNotes-v3.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
