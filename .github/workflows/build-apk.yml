name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AcNotes-v2.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcNotes-v2.1.0-APK
          path: release-output/AcNotes-v2.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.1.0
          name: "AcNotes v2.1.0 - Obsidian Math & Full Vault Sync"
          body: |
            ### 🚀 AcNotes v2.1.0
            
            - **إصلاح المزامنة الكاملة:** دعم مزامنة جميع الملاحظات (أكثر من 100 ملاحظة) بالكامل بفضل المعالجة المتوازية والتشفير الصحيح لمسارات S3 باللغة العربية والمسافات.
            - **محرك قراءة فائق الدقة (Obsidian-grade Math & Markdown Reader):**
              - دعم كامل ودقيق لمعادلات الرياضيات KaTeX / LaTeX (نهايات، تكاملات، جذور، دوال).
              - تنسيق متطور للجداول والملاحظات المزدوجة عربي/إنجليزي (Bi-directional RTL/LTR).
              - مربعات اختيار تفاعلية للمهام قابلة للنقر والحفظ الفوري.
            - **واجهة أصلية وخفيفة للغاية:** سلاسة مطلقة بالوضع الداكن الفاخر.
          files: release-output/AcNotes-v2.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
