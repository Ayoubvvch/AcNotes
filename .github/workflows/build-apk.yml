name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/AcNotes-v2.5.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcNotes-v2.5.0-APK
          path: release-output/AcNotes-v2.5.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.5.0
          name: "AcNotes v2.5.0 - Ultimate 100% Raw, Fast & Clean Release"
          body: |
            ### 🚀 AcNotes v2.5.0 - 100% Raw, Fast, Great & Clean Update

            - ⚡ **True Full-Text Search:** Instant in-memory search across note titles, folders, previews, and full body content.
            - ✍️ **Enhanced Writing Engine:**
              - Smart list & task continuation: hitting Enter on `- [ ] ` or `- ` automatically continues the list. Hitting Enter on an empty marker cleanly cancels it.
              - Smart headings: `H1` and `H2` insert directly at the beginning of the current line.
              - Dedicated LaTeX Math formatting chips (`∑ Math` and `x² Math`).
              - Bulletproof Auto-Save: Navigating back or using Android system back gestures automatically saves the note.
            - 📖 **Seamless Reading Experience:**
              - Fixed interactive checklist synchronization: toggling tasks in reading mode updates the exact task without jumping or desync.
              - Smooth scroll restoration when interacting with note content.
            - ☁️ **Robust Cloudflare R2 Sync Engine:**
              - Complete S3 Pagination support for 1,000+ notes without data truncation.
              - Protected local notes against partial network drops.
            - 🧹 **Pure Native Cleanup:**
              - Removed 300+ lines of dead code.
              - Streamlined database and architecture.
          files: release-output/AcNotes-v2.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
