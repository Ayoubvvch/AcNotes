name: Build AcNotes Pure Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/AcNotes-v3.3.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
            name: AcNotes-v3.3.0-Signed-APK
            path: release-output/AcNotes-v3.3.0.apk
            if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: v3.3.0
            name: "AcNotes v3.3.0 - System Share Sheet Import, Multi-File Drive Upload & .Vault Storage"
            body: |
              ### 🚀 AcNotes v3.3.0 - System Share Sheet Import, Multi-File Drive Upload & .Vault Storage

              - 📤 **Android System Share Sheet Integration:**
                - AcNotes now appears in the system Share Sheet across all apps (Google Drive, Chrome, WhatsApp, Telegram, Files, etc.).
              - 📑 **Single & Multi-File Upload Support:**
                - Share single or multiple markdown files, text files, code, or images directly into AcNotes with one tap.
              - 📁 **Interactive "Upload to Vault" Modal:**
                - Preview all incoming items, choose the destination folder (Home or any custom folder, or create a new folder on the spot), and tap **"Upload Here"**.
              - ☁️ **Full .Vault Root Storage:**
                - Reverted root storage fully to `.Vault/` across all notes, subfolders, profile, and avatar with complete backward compatibility.
              - 🔐 **Cryptographically Signed APK (In-Place Updates):**
                - Retains release key signature for seamless in-place installation over existing releases.
            files: release-output/AcNotes-v3.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
